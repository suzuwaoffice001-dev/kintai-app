<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>勤怠アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>勤怠アプリ</h1>

    <div class="time-box">
      <p id="nowTime"></p>
    </div>

    <div class="btn-box">
      <button id="checkInBtn">チェックイン</button>
      <button id="checkOutBtn">チェックアウト</button>
    </div>

    <div class="log-box">
      <h2>ログ</h2>
      <ul id="logList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
