<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700&display=swap" rel="stylesheet">

<div class="title">
  鶴岡
</div>

<div class="role-selector">
  <button onclick="setRole('toban')">当番</button>
  <button onclick="setRole('sub')">サブ</button>
  <button onclick="setRole('normal')">通常</button>
</div>

<div class="container">

  <div class="input-block">
    <label>出勤時間（自動入力）</label>
    <input type="text" id="start-time" readonly>
  </div>

  <div class="input-block">
    <label>退勤時間（1500 → 15:00）</label>
    <input type="text" id="end-time" oninput="manualCheckout()" onkeydown="disableEnter(event)">
  </div>

  <div class="input-block">
    <label>勤務時間</label>
    <input type="text" id="work-time" readonly>
  </div>

</div>

<script src="script.js"></script>
