<div class="role-selector">
  <button onclick="setRole('toban')">当番</button>
  <button onclick="setRole('sub')">サブ</button>
  <button onclick="setRole('ippan')">一般</button>
</div>

<div class="container">
  <h1>勤怠アプリ</h1>

  <div id="current-time"></div>

  <button id="checkin-btn" onclick="autoCheckIn()">出勤</button>

  <div class="checkout-area">
    <label>退勤時間</label>
    <input type="time" id="checkout-time">
    <button onclick="manualCheckout()">退勤</button>
  </div>

  <div id="work-time"></div>

  <button onclick="showLog()">ログ</button>
  <div id="log"></div>
</div>
